[project]
name = "orbit"
default-app = "web"
jac-version = "==0.37.12"

[apps]
[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.mobile.dependencies]
[apps.mobile.dependencies.npm]
[apps.mobile.dependencies.npm.native]
expo-font = "~14.0.0"
lucide-react-native = "^0.469.0"
react-native-svg = "^15.13.0"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.cli.test]
directories = ["."]

[apps.cli.check]
[apps.cli.check.lint]
ignore = ["no-print"]

[apps.desktop]
kind = "desktop"
entry-point = "desktop.main"

[apps.desktop.desktop]
name = "Orbit"
identifier = "org.orbit.desktop"
backend = "http://localhost:8000"

[apps.desktop.desktop.window]
title = "Orbit"
width = 1200
height = 820
min_width = 900
min_height = 600

[precommit]
typecheck = true

[test]
directories = ["core", "web", "mobile", "cli"]

[check]
[check.lint]
select = ["all"]
ignore = ["no-print"]
exclude = [".jac/*"]

[placement.pins]
# Pin the core modules to the server so their `def:pub` functions bridge to the
# web/mobile clients over RPC instead of being pulled into the client bundle
# (which would drag `datetime` in and fail client codegen). Clients receive the
# nodes/objs/enums as wire types across the single service boundary.
"core.orbit.model" = "server"
"core.orbit.config" = "server"
"core.orbit.llm" = "server"
"core.orbit.connectors" = "server"
"core.orbit.assistant" = "server"
"core.orbit.timeutil" = "server"
"core.orbit.scoring" = "server"
"core.orbit.areas" = "server"
"core.orbit.items" = "server"
"core.orbit.briefing" = "server"
"core.orbit.analytics" = "server"
"core.orbit.ai" = "server"
"core.orbit.demo" = "server"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "indigo"
font = "geist"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[byllm]
[byllm.model]
default_model = "local:qwen3.5-4b"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "Orbit"
description = "The agenda that thinks. One unified planner for your whole life."
keywords = "orbit, planner, agenda, tasks, jac"
author = "Jeremy Moon"
theme_color = "#6366f1"

[dependencies]
"byllm[local]" = ">=0.0.0"
[dependencies.npm]
marked = "^14.1.4"
"@fontsource-variable/geist" = "*"
"@hugeicons/react" = "^1.1.9"
"@hugeicons/core-free-icons" = "^4.2.3"
radix-ui = "^1.6.7"
class-variance-authority = "^0.7.1"
tw-animate-css = "^1.4.0"
tailwind-merge = "^3.5.0"
clsx = "^2.1.1"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
react-native-web = "^0.19.13"
